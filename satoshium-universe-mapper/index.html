<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Satoshium Universe Mapper — Temporary Architecture Workbench</title>
  <meta name="description" content="Temporary entry point to the Satoshium Universe Mapper RC 0.1 architecture workbench.">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- Temporary redirect to the Replit-hosted RC 0.1 release -->
  <meta http-equiv="refresh" content="2;url=https://satoshium-universe-mapper.replit.app/">

  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --panel: #0d1117;
      --border: #2a2f37;
      --text: #e8edf7;
      --muted: #9da7b5;
      --gold: #f4c36a;
      --gold-hover: #d6a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(680px, 100%);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.15;
    }

    .subtitle {
      margin: 10px 0 20px;
      color: var(--muted);
      font-size: 1rem;
    }

    .note {
      margin: 0 auto 24px;
      max-width: 560px;
      color: var(--muted);
    }

    a {
      color: var(--gold);
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: var(--gold-hover);
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
      border-radius: 2px;
    }
  </style>

  <script>
    window.setTimeout(function () {
      window.location.replace("https://satoshium-universe-mapper.replit.app/");
    }, 2000);
  </script>
</head>

<body>
  <main>
    <p class="eyebrow">Satoshium</p>
    <h1>Universe Mapper</h1>
    <p class="subtitle">Temporary Architecture Workbench · RC 0.1</p>

    <p class="note">
      The Satoshium Universe Mapper is currently hosted as an interim Replit
      release while Beacon and Attestor remain in Development.
      Redirecting to the Mapper…
    </p>

    <p>
      If you are not redirected automatically,
      <a href="https://satoshium-universe-mapper.replit.app/">open the Mapper</a>.
    </p>
  </main>
</body>
</html>
